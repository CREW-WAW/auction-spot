server:
  port: 8081

spring:
  application:
    name: aspot-user
  
  datasource:
    url: jdbc:mysql://localhost:3306/aspotdb?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: aspot-${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.spot.user.*
  
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${eureka_url:http://127.0.0.1:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.spot.user: DEBUG
    org.springframework.security: DEBUG
